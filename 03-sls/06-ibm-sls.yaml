
apiVersion: sls.ibm.com/v1
kind: LicenseService
metadata:
  name: sls
  labels:
    app.kubernetes.io/instance: ibm-sls
    app.kubernetes.io/managed-by: olm
    app.kubernetes.io/name: ibm-sls
  namespace: ibm-sls
spec:
  license:
    accept: true
  reloadCrd:
    fileUpload: 0
  settings:
    auth:
      enforce: true
    compliance:
      enforce: true
    registration:
      open: true
    reporting:
      maxDailyReports: 90
      maxHourlyReports: 24
      maxMonthlyReports: 12
      reportGenerationPeriod: 3600
      samplingPeriod: 900
  domain: codehub1.fyre.ibm.com
  mongo:
    nodes:
      - host: codehub1.fyre.ibm.com
        port: 27017
    configDb: admin
    secretName: ibm-sls-mongo-credentials
    authMechanism: DEFAULT
    dbPrefix: ibm-sls_sls_
